# Multimodal token accounting rules
# Source: https://ai.google.dev/gemini-api/docs/tokens
# Note: For OpenRouter (google/gemini-3.8-flash), image tile rate and audio token rate
# are UNVERIFIED conservative estimates with a 1.5 safety factor applied.
token_accounting:
  # Image: 258 tokens per 768x768 tile (flat 258 tokens for images <= 384px or <= 768px single tile)
  image_tokens_per_tile: 258
  # Measured 2026-11-17 on 31 persona calls (8 frames of 360x640 + audio): input tokens stayed 10.2k-12.1k
  # whatever the audio length, i.e. about 1,120 tokens per frame, not 258 per tile.
  min_image_tokens_per_frame: 1120
  # Conservative text token bound: UTF-8 byte length (>= 1 byte/token in subword BPE tokenizers)
  bytes_per_text_token_upper_bound: 1.0
  # Audio token rate (32 tokens/s * ceil(duration)) plus fixed 10% safety margin
  audio_tokens_per_second: 32
  audio_safety_margin_pct: 0.10
  # Safety factor of 1.5 on image and audio token terms for unverified OpenRouter multimodal rates
  multimodal_safety_factor: 1.5
  # Video: 263 tokens per second if ingested directly
  video_tokens_per_second: 263
  # Default expected output tokens for estimation
  default_content_output_tokens: 4096  # live 2026-11-15: 1200 truncated the JSON at ~4.7k chars (Vietnamese rubric + evidence)
  default_reasons_output_tokens: 2048  # headroom for Vietnamese reasons JSON
  # Fixed per-request framing and system overhead token margin (R2-1 round 3)
  request_overhead_tokens: 200
  # Maximum video duration in seconds to analyze (clips audio and frames)
  max_analyzed_seconds: 90
  # Maximum video audio duration in seconds for worst-case headroom reservation
  max_audio_seconds: 180
  # Maximum estimated input text tokens for worst-case headroom reservation
  max_content_text_tokens: 5000
  max_reasons_text_tokens: 4000
  source_url: "https://ai.google.dev/gemini-api/docs/tokens"
  accessed_date: "2026-11-15"

# OpenRouter client configuration
openrouter:
  # reasoning: configurable, default omits the reasoning field entirely from request payload
  # Example: {effort: "none"} or {effort: "low"}
  reasoning: {effort: minimal}  # live test 2026-11-15: reasoning cannot be disabled on google/gemini-3.8-flash; minimal + json_schema returned clean JSON
  frequency_penalty: 0.3

response_schema_mode:
  supported: true
  source_url: "https://openrouter.ai/docs/structured-outputs"
  accessed_date: "2026-11-15"

usage_metadata_fields:
  prompt_token_count: "prompt_tokens"
  candidates_token_count: "completion_tokens"
  cost: "cost"
  prompt_tokens_details: "prompt_tokens_details"
  source_url: "https://openrouter.ai/docs"
  accessed_date: "2026-11-15"
